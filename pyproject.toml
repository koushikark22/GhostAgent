[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostgraph-agent-offboarding"
version = "0.1.0"
description = "LangGraph-based agent offboarding and residual access detection platform"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "networkx>=3.2.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
